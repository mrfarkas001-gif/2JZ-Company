<script>
    async function kuldes() {
        const data = {
            frakcio: document.getElementById("frakcio").value,
            termek: document.getElementById("termek").value,
            telefon: document.getElementsByName("telefon")[0].value,
            elerhetoseg: document.getElementsByName("elerhetoseg")[0].value,
            megjegyzes: document.getElementsByName("megjegyzes")[0].value
        };

        // Itt a kulcs: JSON-t küldünk, és a content-type 'application/json'
        await fetch("https://script.google.com/macros/s/AKfycbwkioOffuhWeCMi7ZIpLbx_fizCQt3XGVQIgoiD2CS1ebJRHC7YLNjCkNzcF837B_js/exec", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });
        
        alert("Rendelés sikeresen elküldve!");
        location.reload();
    }
</script>
