<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>2JZ Company</title>
    <style>
        body { background:#111; color:white; font-family:sans-serif; text-align:center; padding:20px; }
        .box { max-width:500px; margin:auto; background:#1a1a1a; padding:20px; border:2px solid gold; border-radius:10px; }
        input, select, textarea { width:100%; padding:10px; margin:5px 0; border-radius:5px; border:none; box-sizing:border-box; }
        button { background:red; color:white; padding:15px; width:100%; border:none; cursor:pointer; }
    </style>
</head>
<body>

<div class="box">
    <h2>Rendelés</h2>
    <form id="rendelesForm" target="hidden_iframe" onsubmit="submitted=true;">
        <select id="frakcio" name="frakcio" onchange="frissit()" required>
            <option value="">Frakció választás</option>
            <option value="2JZ Garage">2JZ Garage</option>
            <option value="2JZ Gunshop">2JZ Gunshop</option>
            <option value="Kingsman">Kingsman</option>
        </select>
        <select id="termek" name="termek" required><option>Válassz frakciót!</option></select>
        <input type="text" name="telefon" placeholder="Telefonszám" required>
        <input type="text" name="elerhetoseg" placeholder="Discord név" required>
        <textarea name="megjegyzes" placeholder="Megjegyzés"></textarea>
        <button type="submit" id="btn">Küldés</button>
    </form>
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { alert('Sikeres rendelés!'); location.reload(); }"></iframe>
</div>

<script>
    var submitted = false;
    const url = "https://script.google.com/macros/s/AKfycbwkioOffuhWeCMi7ZIpLbx_fizCQt3XGVQIgoiD2CS1ebJRHC7YLNjCkNzcF837B_js/exec";
    document.getElementById("rendelesForm").action = url;

    function frissit() {
        const f = document.getElementById("frakcio").value;
        const t = document.getElementById("termek");
        t.innerHTML = "";
        let lista = f === "2JZ Garage" ? ["Nitro", "Szerelőláda"] : 
                    f === "2JZ Gunshop" ? ["Vízipisztoly", "Nerf MK2"] : ["Egyéni"];
        lista.forEach(i => t.innerHTML += `<option value="${i}">${i}</option>`);
    }
</script>
</body>
</html>
